info:
  name: Update User Name
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/me/name"
  body:
    type: json
    data: |-
      {
        "userName": "rima_new_name"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: expect(res.getStatus()).to.equal(200);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
