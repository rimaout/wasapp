info:
  name: Updated User Avatar
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/me/avatar"
  body:
    type: multipart-form
    data:
      - name: binaryImage
        type: file
        value:
          - /Users/rima/Downloads/profile.jpeg
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
