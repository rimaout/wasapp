info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/session"
  body:
    type: json
    data: |-
      {
        "userName":"rima"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        // Extract the raw UUID by removing the "Bearer " prefix
        const rawToken = data.token.replace("Bearer ", "");
        // Save as collection variables (no environment selection needed!)
        bru.setVar("token", rawToken);
        bru.setVar("userId", data.userId);
    - type: tests
      code: expect(res.getStatus()).to.be.oneOf([200, 201]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
