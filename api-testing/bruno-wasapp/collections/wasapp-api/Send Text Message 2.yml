info:
  name: Send Text Message 2
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseUrl}}/chats/{{directChatId}}/messages"
  body:
    type: multipart-form
    data:
      - name: text
        type: text
        value: Second message
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setVar("msgId2", data.id);
    - type: tests
      code: expect(res.getStatus()).to.equal(201);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
