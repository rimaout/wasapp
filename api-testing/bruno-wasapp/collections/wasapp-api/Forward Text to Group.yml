info:
  name: Forward Text to Group
  type: http
  seq: 82

http:
  method: POST
  url: "{{baseUrl}}/chats/{{directChatId}}/messages/{{msgId2}}/forwards"
  body:
    type: json
    data: |-
      {
        "forwardTo": "{{groupChatId}}"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("fwdMsgId", res.getBody().id);
    - type: tests
      code: expect(res.getStatus()).to.equal(201);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
