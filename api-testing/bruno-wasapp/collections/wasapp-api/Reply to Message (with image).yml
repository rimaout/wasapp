info:
  name: Reply to Message (with image)
  type: http
  seq: 60

http:
  method: POST
  url: "{{baseUrl}}/chats/{{directChatId}}/messages/{{msgId2}}/reply"
  body:
    type: multipart-form
    data:
      - name: text
        type: text
        value: Reply with image
      - name: imageFile
        type: file
        value:
          - /Users/rima/Documents/Dev/Uni/WASA/wasapp/api-testing/bruno-wasapp/assets/test-group-image.jpg
        contentType: image/jpeg
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  scripts:
    - type: tests
      code: expect(res.getStatus()).to.equal(201);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
