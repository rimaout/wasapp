info:
  name: Set Group Name
  type: http
  seq: 31

http:
  method: PATCH
  url: "{{baseUrl}}/chats/{{groupChatId}}/name"
  body:
    type: json
    data: |-
      {
        "groupName": "Thrombey Dynasty"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  scripts:
    - type: tests
      code: expect(res.getStatus()).to.equal(200);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
