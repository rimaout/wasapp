  url: "{{baseUrl}}/chats/{{groupChatId}}/messages/{{fwdMsgId}}/forwards"
  body:
    type: json
    data: |-
      {
        "forwardTo": "{{directChatId}}"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
