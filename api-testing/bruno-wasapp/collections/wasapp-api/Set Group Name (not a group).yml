info:
  name: Set Group Name (not a group)
  type: http
  seq: 33

http:
  method: PATCH
  url: "{{baseUrl}}/chats/{{directChatId}}/name"
  body:
    type: json
    data: |-
      {
        "groupName": "Not a Group"
      }
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  scripts:
    - type: tests
      code: expect(res.getStatus()).to.equal(409);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
