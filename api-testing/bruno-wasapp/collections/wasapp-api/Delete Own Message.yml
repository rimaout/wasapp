info:
  name: Delete Own Message
  type: http
  seq: 62

http:
  method: DELETE
  url: "{{baseUrl}}/chats/{{directChatId}}/messages/{{msgId}}"
  auth:
    type: bearer
    token: "{{tokenA}}"

runtime:
  scripts:
    - type: tests
      code: |-
        expect(res.getStatus()).to.equal(200);
        expect(res.getBody().isDeleted).to.equal(true);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
