info:
  name: Login B (Harlan)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/session"
  body:
    type: json
    data: |-
      {
        "userName":"Harlan Thrombey"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setVar("tokenB", data.token.replace("Bearer ", ""));
        bru.setVar("userIdB", data.userId);
    - type: tests
      code: expect(res.getStatus()).to.be.oneOf([200, 201]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
