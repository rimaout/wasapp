server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API max image size is 5 MB; nginx default (1 MB) would reject uploads with 413.
    client_max_body_size 6m;

    # Forward API calls to the Go backend, stripping the /api prefix.
    # `backend` is the compose service name, resolved on the compose network.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static SPA (hash routing -> serve files, fall back to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}