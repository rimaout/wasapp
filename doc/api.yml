openapi: 3.0.0

info:
  title: API documentation for the Wasapp service.
  description: |
    API for interacting with Wasapp, a messaging service.
  version: 1.0.0

paths:

  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: User created, and User log-in action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identifier'
        '200':
          description: User log-in action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identifier'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{userID}/username:
    parameters:
      - $ref: "#/components/parameters/UserID"
      
    patch:
      tags: ["profile-management"]
      summary: "Update user's name"
      operationId: setMyUserName
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: Successfully updated user name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username (too short/too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required or failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden—changing another user's name is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:

    UserID:
      name: userID
      in: path
      description: A user's unique id
      required: true
      schema:
        $ref: "#/components/schemas/UserID"

  schemas:
    
    BaseID:
      type: integer
      format: int64 
      readOnly: true
      example: 12345
    
    UserID:
      allOf:
        - $ref: '#/components/schemas/BaseID'
        - description: Unique identifier for the user assigned by the server.

    LoginRequest:
      type: object
      required: [userName]
      properties:
        userName:
          $ref: '#/components/schemas/UserName'

    Identifier:
      type: object
      properties:
        identifier:
          $ref: '#/components/schemas/UserID'
    
    User:
      type: object
      description: Represents a user of the platform.
      required: [userID, userName]
      properties:
        userID:
          $ref: '#/components/schemas/UserID'
        userName:
          $ref: '#/components/schemas/UserName'
        profilePic:
          $ref: '#/components/schemas/ProfilePic'

    UserName:
      type: string
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16
      example: Feldspar

    ProfilePic:
      type: string
      format: uri
      description: URL to the user's profile image

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]