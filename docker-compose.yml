services:
  # --- BACKEND ---
  backend:
    container_name: wasa-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      # Bind mount: the DB is saved as a real folder on the host filesystem
      - ./data:/data
    environment:
      # Override the default DB path (/tmp/decaf.db)
      CFG_DB_FILENAME: /data/wasapp.db
      # Override the default uplads path (/tmp/uploads)
      # Notes: the uploads dir is where avatars images and message images are saved
      CFG_UPLOADS_DIR: /data/uploads
    restart: unless-stopped

  # --- FRONTEND ---
  frontend:
    container_name: wasa-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"            # App at http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend              # Start only after backend

# ==================== Usage ====================
# docker compose up --build   -> build and start everything
# docker compose up           -> start everything (no build so images must be built first)
