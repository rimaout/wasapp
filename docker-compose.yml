services:
  # --- BACKEND ---
  backend:
    container_name: wasa-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"          # API at http://localhost:3000 (matches the frontend's hardcoded __API_URL__)
    environment:
      # Override the default DB path (/tmp/decaf.db)
      # Note: /data is a volume mount point, so the SQLite file is inside a persistent volume
      CFG_DB_FILENAME: /data/wasapp.db
      # Override the default uplads path (/tmp/uploads)
      # Notes:
      #   - the uploads dir is where avatars images and message images are saved
      #   - /data is a volume mount point, so the uplades dir is inside a persistent volume
      CFG_UPLOADS_DIR: /data/uploads
    volumes:
      # Bind mount: the DB is saved as a real folder on the host filesystem
      - ./data:/data
    restart: unless-stopped

  # --- FRONTEND ---
  frontend:
    container_name: wasa-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"            # App at http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend              # Start only after backend

# ==================== Usage ====================
# docker compose up --build   -> build and start everything
# docker compose up           -> start everything (no build so images must be built first)
